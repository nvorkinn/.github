name: All checks

# Reusable. Completes the "Global PR Status" check (opened by create-global-pr-status.yml, and found by name on the
# commit) on a pull request's head commit. It is the one check branch protection requires: other workflows only run
# when their paths change, so requiring them directly blocks every PR that doesn't touch them. Each workflow the caller
# lists in its workflow_run trigger ends by running this once, and it looks at everything on the commit: if something is
# still running, the last workflow to finish runs it again; if everything passed, the check succeeds; if anything
# failed, it fails.
#
# Call it from a workflow in the consumer repository (on its default branch), which owns the trigger:
#
#   name: All checks
#   on:
#     workflow_run:
#       workflows: [ Create Global PR Status, Tests ]  # every workflow that runs on pull requests, except auto-approve
#       types: [ completed ]
#   permissions: { actions: read, checks: write }
#   jobs:
#     all-checks:
#       uses: nvorkinn/.github/.github/workflows/all-checks.yml@main
on:
  workflow_call:
    inputs:
      auto-approve-workflow-name:
        description: Name of the workflow that auto-approves, which waits for the status check and so can't be waited on.
        required: false
        type: string
        default: Auto-approve PRs

permissions:
  actions: read
  checks: write

jobs:
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    # CodeQL's default setup runs with the event "dynamic".
    if: contains(fromJSON('["pull_request", "dynamic"]'), github.event.workflow_run.event)
    timeout-minutes: 5
    steps:
      - name: Settle the Global PR Status check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          # Auto-approve waits for the Global PR Status check, so waiting on it would deadlock.
          AUTO_APPROVE_WORKFLOW: ${{ inputs.auto-approve-workflow-name }}
          # The status check itself is in progress until this finishes. Reusable jobs can have "caller / " prefixes.
          IGNORED_CHECKS: '["all-checks","auto-approve","Global PR Status"]'
        run: |
          # The status check opened on this commit by create-global-pr-status.yml. Fork and Dependabot pull requests have
          # none, and until that workflow has run there isn't one yet; its own completion runs this again.
          check_run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Global%20PR%20Status&filter=latest" \
            --jq '.check_runs | max_by(.id) | .id // empty')
          if [ -z "$check_run" ]; then
            echo "::notice::No Global PR Status check on $SHA yet (or ever, for a fork or Dependabot pull request)."
            exit 0
          fi

          ok='["success","skipped","neutral"]'
          runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" |
            jq -s --arg workflow "$WORKFLOW_NAME" --arg approval "$AUTO_APPROVE_WORKFLOW" '
              [.[].workflow_runs[] | select(.name != $workflow and .name != $approval)]
              | group_by([.workflow_id, .event]) | map(max_by(.id))
              | map({name, status, conclusion, url: .html_url})')
          checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" |
            jq -s --argjson ignored "$IGNORED_CHECKS" '
              [.[].check_runs[] | select(.name | split(" / ")[-1] | IN($ignored[]) | not)]
              | group_by(.name) | map(max_by(.id))
              | map({name, status, conclusion, url: .html_url})')

          failed=$(jq -n --argjson ok "$ok" --argjson runs "$runs" --argjson checks "$checks" \
            '[$runs[], $checks[] | select(.status == "completed" and (.conclusion | IN($ok[]) | not))]')
          if [ "$(jq length <<<"$failed")" -gt 0 ]; then
            echo "::error::Some checks didn't pass:"
            jq -r '.[] | "  \(.name): \(.conclusion) \(.url)"' <<<"$failed"
            gh api --method PATCH "repos/$REPO/check-runs/$check_run" -f status=completed -f conclusion=failure \
              -f 'output[title]=Some checks failed' \
              -f "output[summary]=$(jq -r '.[] | "- \(.name): \(.conclusion) \(.url)"' <<<"$failed")" --jq .conclusion
            exit 0
          fi

          pending=$(jq -n --argjson runs "$runs" --argjson checks "$checks" \
            '[$runs[], $checks[] | select(.status != "completed") | .name]')
          if [ "$(jq length <<<"$pending")" -gt 0 ]; then
            echo "Still running: $(jq -r 'join(", ")' <<<"$pending"). The last of them to finish runs this again."
            exit 0
          fi

          echo "All checks passed:"
          jq -r '.[] | "  \(.name): \(.conclusion)"' <<<"$checks"
          gh api --method PATCH "repos/$REPO/check-runs/$check_run" -f status=completed -f conclusion=success --jq .conclusion
