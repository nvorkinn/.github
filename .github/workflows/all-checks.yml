name: All checks

# Reusable. Completes the "Global PR Status" check (opened by create-global-pr-status.yml, and found by name on the
# commit) on a pull request's head commit. It is the one check branch protection requires: other workflows only run
# when their paths change, so requiring them directly blocks every PR that doesn't touch them. Each workflow the caller
# lists in its workflow_run trigger ends by running this once, and it looks at everything on the commit: if something is
# still running, the last workflow to finish runs it again; if everything passed, the check succeeds; if anything
# failed, it fails.
#
# Call it from a workflow in the consumer repository (on its default branch), which owns the trigger:
#
#   name: All checks
#   on:
#     workflow_run:
#       workflows: [ Create Global PR Status, Tests ]  # every workflow that runs on pull requests
#       types: [ completed ]
#   permissions: { actions: read, checks: write, contents: read, pull-requests: write }
#   jobs:
#     all-checks:
#       uses: nvorkinn/.github/.github/workflows/all-checks.yml@main
#       with:
#         approve: true  # optional: also approve the pull request when everything passed
on:
  workflow_call:
    inputs:
      approve:
        description: >-
          Approve the pull request's commit just before the status check succeeds. Needs "Allow GitHub Actions to
          create and approve pull requests" enabled in the repository's settings. Skips drafts, forks and bots.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    # CodeQL's default setup runs with the event "dynamic".
    if: contains(fromJSON('["pull_request", "dynamic"]'), github.event.workflow_run.event)
    timeout-minutes: 5
    steps:
      - name: Settle the Global PR Status check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          # The status check itself is in progress until this finishes. Reusable jobs can have "caller / " prefixes.
          IGNORED_CHECKS: '["all-checks","Global PR Status"]'
          APPROVE: ${{ inputs.approve }}
        run: |
          # Approves the open pull requests whose head is this commit, once each. Failing to is a warning, not a
          # failure, so the status check below is completed either way.
          approve() {
            local numbers number approved current
            numbers=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '
              .[] | select(.state == "open" and (.draft | not) and .head.sha == env.SHA
                           and .head.repo.full_name == env.REPO and .user.type != "Bot") | .number') || return 1
            for number in $numbers; do
              approved=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" --jq '
                .[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == env.SHA)
                | .id') || return 1
              if [ -n "$approved" ]; then
                echo "#$number: already approved at $SHA."
                continue
              fi
              current=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha) || return 1
              if [ "$current" != "$SHA" ]; then
                echo "::warning::#$number's head changed while checking; not approving $SHA."
                continue
              fi
              echo "#$number: approving $SHA."
              gh api --method POST "repos/$REPO/pulls/$number/reviews" -f event=APPROVE -f commit_id="$SHA" \
                --jq '"#'"$number"': " + .state' || return 1
            done
          }

          # The status check opened on this commit by create-global-pr-status.yml. Fork and Dependabot pull requests have
          # none, and until that workflow has run there isn't one yet; its own completion runs this again.
          check_run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Global%20PR%20Status&filter=latest" \
            --jq '.check_runs | max_by(.id) | .id // empty')
          if [ -z "$check_run" ]; then
            echo "::notice::No Global PR Status check on $SHA yet (or ever, for a fork or Dependabot pull request)."
            exit 0
          fi

          # From here the status check is this script's to settle. If it dies first (a failed API call, a timeout), fail
          # the check instead of leaving it in progress for good; re-running the workflow settles it again.
          settled=false
          fail_unsettled() {
            local status=$?
            if [ "$status" -ne 0 ] && [ "$settled" != true ]; then
              gh api --method PATCH "repos/$REPO/check-runs/$check_run" -f status=completed -f conclusion=failure \
                -f 'output[title]=All checks failed to run' \
                -f "output[summary]=It errored before it could settle this check: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
                --jq .conclusion || echo "::warning::Couldn't fail the Global PR Status check either."
            fi
          }
          trap fail_unsettled EXIT
          trap 'exit 143' TERM INT

          ok='["success","skipped","neutral"]'
          runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" |
            jq -s --arg workflow "$WORKFLOW_NAME" '
              [.[].workflow_runs[] | select(.name != $workflow)]
              | group_by([.workflow_id, .event]) | map(max_by(.id))
              | map({name, status, conclusion, url: .html_url})')
          checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&per_page=100" |
            jq -s --argjson ignored "$IGNORED_CHECKS" '
              [.[].check_runs[] | select(.name | split(" / ")[-1] | IN($ignored[]) | not)]
              | group_by(.name) | map(max_by(.id))
              | map({name, status, conclusion, url: .html_url})')

          failed=$(jq -n --argjson ok "$ok" --argjson runs "$runs" --argjson checks "$checks" \
            '[$runs[], $checks[] | select(.status == "completed" and (.conclusion | IN($ok[]) | not))]')
          if [ "$(jq length <<<"$failed")" -gt 0 ]; then
            echo "::error::Some checks didn't pass:"
            jq -r '.[] | "  \(.name): \(.conclusion) \(.url)"' <<<"$failed"
            gh api --method PATCH "repos/$REPO/check-runs/$check_run" -f status=completed -f conclusion=failure \
              -f 'output[title]=Some checks failed' \
              -f "output[summary]=$(jq -r '.[] | "- \(.name): \(.conclusion) \(.url)"' <<<"$failed")" --jq .conclusion
            settled=true
            exit 0
          fi

          pending=$(jq -n --argjson runs "$runs" --argjson checks "$checks" \
            '[$runs[], $checks[] | select(.status != "completed") | .name]')
          if [ "$(jq length <<<"$pending")" -gt 0 ]; then
            echo "Still running: $(jq -r 'join(", ")' <<<"$pending"). The last of them to finish runs this again."
            exit 0
          fi

          echo "All checks passed:"
          jq -r '.[] | "  \(.name): \(.conclusion)"' <<<"$checks"
          if [ "$APPROVE" = "true" ]; then
            approve || echo "::warning::Couldn't approve the pull request at $SHA."
          fi
          gh api --method PATCH "repos/$REPO/check-runs/$check_run" -f status=completed -f conclusion=success --jq .conclusion
          settled=true
