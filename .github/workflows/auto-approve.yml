name: Auto-approve PRs Template

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # The caller is triggered by pull_request, so the PR is in the event payload
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Optional: Prevent approving draft PRs using the API
          is_draft=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')
          if [ "$is_draft" == "true" ]; then
            echo "PR is still a draft. Skipping approval."
            exit 0
          fi

          current_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$current_sha" != "$SHA" ]; then
            echo "::error::The PR head changed after the CI workflow started; refusing to approve."
            exit 1
          fi
          
          echo "Approving PR #$PR_NUMBER for commit $SHA..."
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$SHA" --jq '.state'
