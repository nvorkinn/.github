name: Create Global PR Status

# Reusable. Opens the "Global PR Status" check on a pull request's head commit, in progress; all-checks.yml finds it by
# name and completes it once every other workflow and check on that commit has passed. Fork pull requests get a
# read-only token, which can't create a check. Dependabot's token starts read-only too, but the permissions key below
# raises it, so Dependabot pull requests get the check and can auto-merge.
#
# Call it from a workflow in the consumer repository:
#
#   name: Create Global PR Status
#   on:
#     pull_request:
#       types: [ opened, synchronize, reopened ]
#   permissions: { checks: write }
#   jobs:
#     create-global-pr-status:
#       uses: nvorkinn/.github/.github/workflows/create-global-pr-status.yml@main
on:
  # This repository's own pull requests, as a caller's would be.
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_call:

permissions:
  checks: write

jobs:
  create-global-pr-status:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - name: Create the check run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$REPO/check-runs" \
            -f name='Global PR Status' -f head_sha="$SHA" -f status=in_progress \
            --jq .id
